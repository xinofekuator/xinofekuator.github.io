<div class="container" id="i18_link">
    <div class="row m-b-lg">
        <div class="col-lg-12 text-center">
            <div class="navy-line"></div>
            <h1><span data-i18n="link.link">Links</span></h1>
        </div>
    </div>
    <div class="row">
    {% for link in site.data.index.links %}
        {% assign loopindex = forloop.index | modulo: 2 %}
        <div class="col-sm-3 wow {% if loopindex == 1 %} fadeInLeft {% else %} fadeInRight {% endif %}">
            <div class="team-member">
                <h4><span class="navy">{{ link.last_name }}</span> {{ link.first_name }}</h4>
                <p>{{ link.desc }}</p>
                <ul class="list-inline social-icon">
                    <li><a href="{{ link.website }}" target="blank"><i class="fa fa-link"></i></a>
                    </li>
                </ul>
            </div>
        </div>
    {% endfor %}
    </div>
    <div class="row">
        <div class="col-lg-8 col-lg-offset-2 text-center m-t-lg m-b-lg">
            <p id="jalpc_site_pv"><strong>&copy; {{ 'now' | date: "%Y" }} {{ site.title }}</strong></p>
        </div>
    </div>
</div>
