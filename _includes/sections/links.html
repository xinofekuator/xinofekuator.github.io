<div class="container" id="i18_link">
    <style>
        #i18_link .col-sm-3 {
            display: flex;
        }
        #i18_link .team-member {
            display: flex;
            flex-direction: column;
            width: 100%;
            text-align: center;
        }
        #i18_link .team-member h4 {
            font-size: 17px;
            font-weight: 600;
            margin-bottom: 6px;
        }
        #i18_link .team-member p {
            font-size: 15px;
            line-height: 1.55;
            color: #4b5563;
            margin-bottom: 12px;
        }
        #i18_link .team-member .social-icon {
            margin-top: auto;
            padding-left: 0;
        }
        #i18_link .social-icon a {
            width: 46px;
            height: 46px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: #3385FF;
            color: #fff;
            font-size: 18px;
            text-decoration: none;
            transition: background 0.25s ease;
        }
        #i18_link .social-icon a:hover {
            background: #1f5fd6;
        }
    </style>
    <div class="row m-b-lg">
        <div class="col-lg-12 text-center">
            <div class="navy-line"></div>
            <h1><span data-i18n="links.links">Links</span></h1>
        </div>
    </div>
    <div class="row">
    {% for link in site.data.index.links %}
        {% assign loopindex = forloop.index | modulo: 2 %}
        <div class="col-sm-3 wow {% if loopindex == 1 %} fadeInLeft {% else %} fadeInRight {% endif %}">
            <div class="team-member">
                <h4><span class="navy">{{ link.last_name }}</span> {{ link.first_name }}</h4>
                <p>{{ link.desc }}</p>
                <ul class="list-inline social-icon">
                    <li><a href="{{ link.website }}" target="blank"><i class="fa fa-link"></i></a>
                    </li>
                </ul>
            </div>
        </div>
    {% endfor %}
    </div>
    <div class="row">
        <div class="col-lg-8 col-lg-offset-2 text-center m-t-lg m-b-lg">
            <p id="jalpc_site_pv"><strong>&copy; {{ 'now' | date: "%Y" }} {{ site.title }}</strong></p>
        </div>
    </div>
</div>
