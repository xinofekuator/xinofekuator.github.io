<div class="container" id="i18_skills">
  <style>
    #i18_skills .skill-cat {
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-size: 15px;
      color: #3385FF;
    }
    #i18_skills .skill-cat i {
      margin-right: 8px;
    }
    #i18_skills .skill-cloud {
      margin-bottom: 24px;
    }
    #i18_skills .skill-chip {
      display: inline-flex;
      align-items: center;
      margin: 0 8px 8px 0;
      padding: 6px 14px;
      border: 1px solid #cfd8dc;
      border-radius: 20px;
      background: #fff;
      color: #475569;
      font-size: 13px;
      transition: all 0.2s ease;
    }
    #i18_skills .skill-chip i {
      margin-right: 7px;
      font-size: 17px;
      color: #94a3b8;
      transition: color 0.2s ease;
    }
    #i18_skills .skill-chip:hover {
      border-color: #3385FF;
      background: #eff6ff;
      color: #1e293b;
    }
    #i18_skills .skill-chip:hover i {
      color: #3385FF;
    }
  </style>
  <div class="row">
    <div class="col-lg-12 text-center">
      <div class="navy-line"></div>
      <h1><span data-i18n="skills.my_skills">My Skills</span></h1>
    </div>
  </div>
  <div class="row">
    {% for skill in site.data.index.skills.skills %}
    <div class="col-sm-6 m-t-md">
      <h4 class="skill-cat"><i class="fa {{ skill.icon }}" aria-hidden="true"></i>{{ skill.category }}</h4>
      <div class="skill-cloud">
        {% for item in skill.items %}
        <span class="skill-chip"><i class="{{ item.icon }}" aria-hidden="true"></i>{{ item.name }}</span>
        {% endfor %}
      </div>
    </div>
    {% endfor %}
  </div>
</div>
