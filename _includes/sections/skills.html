<div class="container">
  <div class="row">
    <div class="col-lg-12 text-center" id="i18_skills">
      <div class="navy-line"></div>
      <h1><span data-i18n="skills.my_skills">My Skills</span></h1>
    </div>
  </div>
  <div class="row">
    {% for skill in site.data.index.skills.skills %}
    <div class="col-sm-6 m-t-md">
      <div class="panel panel-default">
        <div class="panel-heading">
          <h4 class="panel-title">{{ skill.category }}</h4>
        </div>
        <div class="panel-body">
          <p>{{ skill.items }}</p>
        </div>
      </div>
    </div>
    {% endfor %}
  </div>
</div>
